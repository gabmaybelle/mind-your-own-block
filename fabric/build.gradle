plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

// The common sources are compiled straight into this jar (no common jar to bundle), so the
// Fabric mod is one file.
sourceSets.main {
	java.srcDir project(':common').file('src/main/java')
	resources.srcDir project(':common').file('src/main/resources')
}

loom {
	mods {
		"mind_your_own_block" {
			sourceSet sourceSets.main
		}
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	// Compatibility runs: `./gradlew :fabric:runClientGameTest -PtestBuildBetter` (or -PtestMacawsFences)
	// plays the in-game test with that mod installed, fetched from Modrinth's maven by version id.
	// Nothing here is bundled or required.
	if (project.hasProperty("testBuildBetter")) {
		runtimeOnly "maven.modrinth:rosetta-lib:${project.rosetta_fabric_version}"
		runtimeOnly "maven.modrinth:build-better:${project.build_better_fabric_version}"
	}
	if (project.hasProperty("testMacawsFences")) {
		runtimeOnly "maven.modrinth:macaws-fences-and-walls:${project.macaws_fences_fabric_version}"
	}
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.named('jar') { archiveBaseName = "${rootProject.name}-fabric" }
tasks.named('sourcesJar') { archiveBaseName = "${rootProject.name}-fabric" }

// Client game tests: `./gradlew :fabric:runClientGameTest` starts a real game and plays through
// the checks in src/gametest. Nothing there ships in the jar.
fabricApi {
	configureTests {
		createSourceSet = true
		modId = "mind_your_own_block_gametest"
		enableGameTests = false
		enableClientGameTests = true
		eula = true
	}
}

// Build Better opens a welcome screen the first time a world loads, which would sit over the test.
// Its runs start as a player who has already seen it.
if (project.hasProperty("testBuildBetter")) {
	def buildBetterConfig = file('build/run/clientGameTest/config/buildbetter.json')
	tasks.matching { it.name == 'runClientGameTest' }.configureEach {
		doFirst {
			buildBetterConfig.parentFile.mkdirs()
			buildBetterConfig.text = '{"hasShownOnboarding": true}'
		}
	}
}
